name: Publish documentation
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.401
            9.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 26.7.0
      - run: dotnet tool restore
      # Site.fs reads the API reference from the library's Debug output.
      - run: dotnet build Partas.AnimeJs/Partas.AnimeJs.fsproj
      - run: dotnet run --project site.fsproj -- build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/output
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
